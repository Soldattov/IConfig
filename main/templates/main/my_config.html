<!--{% extends "base.html" %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/profile.css' %}">

<section class="account-section">
    <div class="container">
        <div class="account-header">
            <div class="account-avatar">
                <i class="fas fa-user"></i>
            </div>
            <div class="account-info">
                <h2>{{ user.get_full_name|default:user.username }}</h2>
                <p>{{ user.email }}</p>
            </div>
        </div>

        <div class="account-tabs">
            <div class="account-tab" data-tab="profile">Профиль</div>
            <div class="account-tab active" data-tab="configurations">Сохранённые конфигурации</div>
            <div class="account-tab" data-tab="orders">Мои заказы</div>
        </div>

        <div class="tab-content active" id="configurations">
            <h3>Мои сборочки</h3>
            <div class="configurations-grid">
        {% for config in configurations %}
        <div class="configuration-card">
            <div class="configuration-header">
                <h3>{{ config.name }}</h3>
                <div class="configuration-actions">
                    <button class="btn-toggle-public" data-config-id="{{ config.id }}" 
                            title="{% if config.is_public %}Сделать приватным{% else %}Сделать публичным{% endif %}">
                        <i class="fas {% if config.is_public %}fa-globe{% else %}fa-lock{% endif %}"></i>
                    </button>
                    <button class="btn-delete" data-config-id="{{ config.id }}" title="Удалить">
                        <i class="fas fa-trash"></i>
                    </button>
                </div>
            </div>
            <div class="configuration-details">
                <p class="price">Итого: {{ config.total_price }} ₽</p>
                <p class="date">Создано: {{ config.created_at|date:"d.m.Y H:i" }}</p>
            </div>
            <div class="configuration-footer">
                <a href="{% url 'main:view_configuration' config.id %}" class="btn btn-primary">Просмотреть</a>
                <a href="{% url 'main:config' %}?load={{ config.id }}" class="btn btn-secondary">Редактировать</a>
            </div>
        </div>
        {% empty %}
        <div class="no-configurations">
            <p>У вас пока нет сохраненных конфигурацый</p>
            <a href="{% url 'main:config' %}" class="btn btn-primary">Создать конфигурацию</a>
        </div>
        {% endfor %}
    </div>
        </div>
    </div>
</section>

<script>
    // Переключение между вкладками
    document.querySelectorAll('.account-tab').forEach(tab => {
        tab.addEventListener('click', () => {
            // Удаляем активный класс у всех вкладок и контента
            document.querySelectorAll('.account-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

            // Добавляем активный класс к выбранной вкладке и соответствующему контенту
            tab.classList.add('active');
            const tabId = tab.getAttribute('data-tab');
            document.getElementById(tabId).classList.add('active');
        });
    });
</script>
{% endblock %}
